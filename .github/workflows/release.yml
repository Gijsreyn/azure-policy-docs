# Publishes both packages to NuGet.org when a version tag is pushed, for example:
#   git tag v0.1.0 && git push origin v0.1.0
# Requires a repository secret named NUGET_API_KEY with push rights for the AzurePolicyDocs.* package IDs.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build AzurePolicyDocs.sln --configuration Release -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test AzurePolicyDocs.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack AzurePolicyDocs.sln --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output ./artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
