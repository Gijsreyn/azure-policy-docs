# A push to main verifies the exact commit on both operating systems before releasing.
# Manual runs default to a preview. No secrets are passed to the reusable build workflow.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the version and release notes without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify:
    if: github.repository == 'Gijsreyn/azure-policy-docs' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml

  publish:
    name: Semantic release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install release tooling
        run: npm ci

      - name: Authenticate to NuGet.org with Trusted Publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Release or preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run release:preview
          else
            npm run release
          fi

      - name: Retain release packages for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/release/*.nupkg
          if-no-files-found: ignore

      - name: Retain release test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: TestResults/release/
          if-no-files-found: ignore
